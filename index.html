<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:transparent; overflow:hidden; }
#grimmy-wrap { position:relative; width:100%; height:100%; }
#grimmy-img {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  height:100%; filter:drop-shadow(0 0 16px rgba(150,80,255,.55));
}
#grimmy-img.talking { animation:grimbob .32s ease-in-out infinite alternate; }
@keyframes grimbob {
  from { transform:translateX(-50%) translateY(0); }
  to { transform:translateX(-50%) translateY(-8px); }
}
#grimmy-caption {
  position:absolute; bottom:80%; left:50%; transform:translateX(-50%);
  max-width:82%; padding:8px 14px; color:#fff;
  font:14px/1.4 system-ui, -apple-system, sans-serif; text-align:center;
  text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.7);
  background:transparent; border:none;
}
#grimmy-caption.hidden { display:none; }
#status {
  position:absolute; top:6px; left:6px; width:8px; height:8px;
  border-radius:50%; background:#f44; opacity:.7;
  transition:opacity .6s;
}
#status.ok { background:#4f4; opacity:0; }
</style>

var img = document.getElementById('grimmy-img');
var cap = document.getElementById('grimmy-caption');
var capText = document.getElementById('grimmy-caption-text');
var statusEl = document.getElementById('status');
var queue = [];
var speaking = false;
var flapTimer = null;
var mouthOpen = false;

function pickVoice() {
  try {
    var vs = speechSynthesis.getVoices().filter(function (v) {
      return v.lang && v.lang.toLowerCase().indexOf('en') === 0;
    });
    for (var i = 0; i < vs.length; i++) {
      if (/daniel|david|james|guy|male|fred|alex|tom/i.test(vs[i].name)) return vs[i];
    }
    return vs[0] || null;
  } catch (e) { return null; }
}
function warmUp() {
  try {
    speechSynthesis.getVoices();
    var u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if (window.speechSynthesis) { warmUp(); speechSynthesis.onvoiceschanged = warmUp; }

function setMouth(open) {
  mouthOpen = open;
  img.setAttribute('src', open ? TALK_SRC : IDLE_SRC);
}
function flap(on) {
  if (on) {
    img.classList.add('talking');
    if (flapTimer) clearInterval(flapTimer);
    flapTimer = setInterval(function () { setMouth(!mouthOpen); }, 130);
  } else {
    if (flapTimer) { clearInterval(flapTimer); flapTimer = null; }
    img.classList.remove('talking');
    setMouth(false);
  }
}
function finish() {
  flap(false);
  cap.classList.add('hidden');
  speaking = false;
  pump();
}
function speakLine(text) {
  speaking = true;
  capText.textContent = text;
  cap.classList.remove('hidden');
  var estMs = Math.max(2500, text.length * 85);
  var ended = false;
  var fellBack = false;
  var audio = null;
  function done() {
    if (ended) return; ended = true;
    try { if (audio) audio.pause(); } catch (e) {}
    try { speechSynthesis.cancel(); } catch (e) {}
    clearTimeout(safety);
    finish();
  }
  var safety = setTimeout(done, estMs + 8000);
  function builtinFallback() {
    if (fellBack || ended) return; fellBack = true;
    try { if (audio) audio.pause(); } catch (e) {}
    try {
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if (v) u.voice = v;
      u.pitch = 0.55; u.rate = 0.95; u.volume = 1;
      u.onend = done; u.onerror = done;
      u.onstart = function () { flap(true); };
      speechSynthesis.speak(u);
      setTimeout(function () { if (speaking && !flapTimer && !ended) flap(true); }, 700);
    } catch (e) {
      flap(true);
      setTimeout(done, Math.min(estMs, 8000));
    }
  }
  try {
    audio = new Audio('https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=' + encodeURIComponent(text));
    var started = false;
    audio.onplay = function () { started = true; flap(true); };
    audio.onended = done;
    audio.onerror = function () { builtinFallback(); };
    var pr = audio.play();
    if (pr && pr.catch) pr.catch(function () { builtinFallback(); });
    setTimeout(function () { if (!started) builtinFallback(); }, 5000);
  } catch (e) {
    builtinFallback();
  }
}
function pump() {
  if (speaking || !queue.length) return;
  speakLine(queue.shift());
}

var ws = null;
var reconnectDelay = 2000;
function scheduleReconnect() {
  setTimeout(connect, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 60000);
}
function connect() {
  try {
    ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  } catch (e) { scheduleReconnect(); return; }
  ws.onopen = function () {
    reconnectDelay = 2000;
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + Math.floor(Math.random() * 90000 + 10000));
    ws.send('JOIN #' + CHANNEL);
  };
  ws.onmessage = function (ev) {
    var lines = String(ev.data).split('\r\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line) continue;
      if (line.indexOf('PING') === 0) {
        try { ws.send('PONG' + line.substring(4)); } catch (e) {}
        continue;
      }
      if (line.indexOf('PRIVMSG #') !== -1 || line.indexOf(' 366 ') !== -1) {
        statusEl.classList.add('ok');
      }
      var m = line.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/);
      if (m && m[1].toLowerCase() === BOT && m[2]) {
        queue.push(m[2]);
        pump();
      }
    }
  };
  ws.onclose = function () {
    statusEl.classList.remove('ok');
    scheduleReconnect();
  };
  ws.onerror = function () { try { ws.close(); } catch (e) {} };
}
connect();

var testMsg = qs.get('test');
if (testMsg !== null) {
  setTimeout(function () {
    queue.push(testMsg || 'Grimmy talk box is online.');
    pump();
  }, 1500);
}
</script>
