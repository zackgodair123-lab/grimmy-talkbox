<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimmy Live</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:transparent; overflow:hidden; }
#grimmy-wrap { position:relative; width:100%; height:100%; }
#grimmy-img {
  position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  height:100%; filter:drop-shadow(0 0 16px rgba(150,80,255,.55));
}
#grimmy-img.talking { animation:grimbob .32s ease-in-out infinite alternate; }
@keyframes grimbob {
  from { transform:translateX(-50%) translateY(0); }
  to { transform:translateX(-50%) translateY(-8px); }
}
#grimmy-caption {
  position:absolute; bottom:80%; left:50%; transform:translateX(-50%);
  max-width:82%; padding:8px 14px; color:#fff;
  font:14px/1.4 system-ui, -apple-system, sans-serif; text-align:center;
  text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.7);
  background:transparent; border:none;
}
#grimmy-caption.hidden { display:none; }
#status {
  position:absolute; top:6px; left:6px; width:8px; height:8px;
  border-radius:50%; background:#f44; opacity:.7;
  transition:opacity .6s;
}
#status.ok { background:#4f4; opacity:0; }
#mic {
  position:absolute; top:6px; right:6px; width:8px; height:8px;
  border-radius:50%; background:#888; opacity:.35; transition:all .3s;
}
#mic.on {
  background:#e879f9; opacity:.95; box-shadow:0 0 8px #e879f9;
  animation:micpulse 1.2s ease-in-out infinite alternate;
}
@keyframes micpulse { from { transform:scale(1); } to { transform:scale(1.4); } }
#gear {
  position:absolute; top:0; right:20px; background:none; border:none;
  color:#fff; opacity:.35; font-size:15px; cursor:pointer; padding:4px; z-index:11;
}
#gear:hover { opacity:.85; }
#panel {
  position:absolute; top:28px; right:6px; width:236px; z-index:10;
  background:rgba(10,8,20,.96); border:1px solid rgba(150,80,255,.45);
  border-radius:10px; padding:10px 12px; color:#ddd;
  font:12px/1.5 system-ui,-apple-system,sans-serif; text-align:left;
}
#panel.hidden { display:none; }
#panel .row { margin-bottom:8px; }
#panel label { display:block; font-size:10px; opacity:.7; margin-bottom:2px; text-transform:uppercase; letter-spacing:.5px; }
#panel input {
  width:100%; background:#171226; border:1px solid rgba(150,80,255,.35);
  color:#fff; border-radius:6px; padding:6px 8px; font-size:12px;
}
#listen-btn {
  width:100%; background:#6d28d9; border:none; color:#fff; border-radius:6px;
  padding:8px; font-size:13px; cursor:pointer; margin:2px 0 6px;
}
#listen-btn:hover { background:#7c3aed; }
#panel-status { font-size:11px; opacity:.75; min-height:16px; word-break:break-word; }
#vad-meter { height:6px; background:#171226; border-radius:3px; margin:6px 0 2px; overflow:hidden; }
#vad-fill { height:100%; width:0%; background:#8b5cf6; border-radius:3px; }
#vad-log { font-size:10px; opacity:.7; max-height:72px; overflow-y:auto; word-break:break-word; margin-top:4px; }
#vad-log div { margin-bottom:2px; }
  body.phone { background:#0b0714; }
  body.stream #gear, body.stream #panel, body.stream #mic, body.stream #status, body.stream #grimmy-caption { display:none !important; }
  body.stream { background:transparent; }
  body.phone #panel { top:auto; bottom:8px; right:8px; left:8px; width:auto; max-height:62%; overflow-y:auto; }
  body.phone #grimmy-img { height:38%; }
  #transcript { font-size:12px; max-height:120px; overflow-y:auto; background:#0b0714; border:1px solid rgba(150,80,255,.25); border-radius:6px; padding:6px 8px; margin-bottom:8px; word-break:break-word; }
  #transcript div { margin-bottom:4px; }
  #transcript .who-you { color:#c4b5fd; } #transcript .who-grimmy { color:#fff; }
  #ask-row { display:flex; gap:6px; margin-bottom:8px; }
  #ask-input { flex:1; background:#171226; border:1px solid rgba(150,80,255,.35); color:#fff; border-radius:6px; padding:8px; font-size:13px; }
  #ask-btn, #stream-btn { background:#6d28d9; border:none; color:#fff; border-radius:6px; padding:8px 10px; font-size:13px; cursor:pointer; }
  #stream-btn { width:100%; margin-bottom:6px; }
  .priv-note { font-size:11px; opacity:.7; margin-bottom:8px; }
</style>
</head>

var img = document.getElementById('grimmy-img');
var cap = document.getElementById('grimmy-caption');

var statusEl = document.getElementById('status');
var queue = [];
var speaking = false;
var flapTimer = null;
var mouthOpen = false;

function pickVoice() {
  try {
    var vs = speechSynthesis.getVoices().filter(function (v) {
      return v.lang && v.lang.toLowerCase().indexOf('en') === 0;
    });
    for (var i = 0; i < vs.length; i++) {
      if (/daniel|david|james|guy|male|fred|alex|tom/i.test(vs[i].name)) return vs[i];
    }
    return vs[0] || null;
  } catch (e) { return null; }
}
function warmUp() {
  try {
    speechSynthesis.getVoices();

    u.volume = 0;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if (window.speechSynthesis) { warmUp(); speechSynthesis.onvoiceschanged = warmUp; }

function setMouth(open) {
  mouthOpen = open;
  img.setAttribute('src', open ? TALK_SRC : IDLE_SRC);
}
function flap(on) {
  if (on) {
    img.classList.add('talking');
    if (flapTimer) clearInterval(flapTimer);
    flapTimer = setInterval(function () { setMouth(!mouthOpen); }, 130);
  } else {
    if (flapTimer) { clearInterval(flapTimer); flapTimer = null; }
    img.classList.remove('talking');
    setMouth(false);
  }
}
function finish() {
  flap(false);
  cap.classList.add('hidden');
  speaking = false;
  pump();
}

      var v = pickVoice();
      if (v) u.voice = v;
      u.pitch = 0.55; u.rate = 0.95; u.volume = 1;
      u.onend = done; u.onerror = done;
      u.onstart = function () { flap(true); };
      speechSynthesis.speak(u);
      setTimeout(function () { if (speaking && !flapTimer && !ended) flap(true); }, 700);
    } catch (e) {
      flap(true);
      setTimeout(done, Math.min(estMs, 8000));
    }
  }
  try {
    audio = new Audio('https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=' + encodeURIComponent(text));
    var started = false;
    audio.onloadedmetadata = function () {
      var d = audio.duration;
      if (!isFinite(d) || d <= 0) d = estMs / 1000;
      durTimer = setTimeout(done, Math.max(600, d * 1000) + 350);
    };
    audio.onplay = function () { started = true; flap(true); };
    audio.onended = done;
    audio.onerror = function () { builtinFallback(); };
    var pr = audio.play();
    if (pr && pr.catch) pr.catch(function () { builtinFallback(); });
    setTimeout(function () { if (!started) builtinFallback(); }, 5000);
  } catch (e) {
    builtinFallback();
  }
}
function pump() {
  if (speaking || !queue.length) return;
  speakLine(queue.shift());
}

var ws = null;
var reconnectDelay = 2000;
function scheduleReconnect() {
  setTimeout(connect, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 60000);
}
function connect() {
  try {
    ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  } catch (e) { scheduleReconnect(); return; }
  ws.onopen = function () {
    reconnectDelay = 2000;
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + Math.floor(Math.random() * 90000 + 10000));
    ws.send('JOIN #' + CHANNEL);
  };
  ws.onmessage = function (ev) {
    var lines = String(ev.data).split('\r\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line) continue;
      if (line.indexOf('PING') === 0) {
        try { ws.send('PONG' + line.substring(4)); } catch (e) {}
        continue;
      }
      if (line.indexOf('PRIVMSG #') !== -1 || line.indexOf(' 366 ') !== -1) {
        statusEl.classList.add('ok');
      }
      var m = line.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/);
      if (m && m[1].toLowerCase() === BOT && m[2]) {
        queue.push(m[2]);
        pump();
      }
    }
  };
  ws.onclose = function () {
    statusEl.classList.remove('ok');
    scheduleReconnect();
  };
  ws.onerror = function () { try { ws.close(); } catch (e) {} };
}
connect();

var testMsg = qs.get('test');
if (testMsg !== null) {
  setTimeout(function () {
    queue.push(testMsg || 'Grimmy talk box is online.');
    pump();
  }, 1500);
}

/* ---- Grimmy ears: listen mode (mic stays on this device, never streamed) ---- */
var micEl = document.getElementById('mic');
var gearEl = document.getElementById('gear');
var panelEl = document.getElementById('panel');
var keyInput = document.getElementById('set-key');
var modelInput = document.getElementById('set-model');
var wakeInput = document.getElementById('set-wake');
var listenBtn = document.getElementById('listen-btn');
var panelStatus = document.getElementById('panel-status');
var vadLogEl = document.getElementById('vad-log');
var vadFillEl = document.getElementById('vad-fill');
function vlog(t) {
  try {
    var d = document.createElement('div');
    d.textContent = t;
    vadLogEl.appendChild(d);
    while (vadLogEl.children.length > 30) vadLogEl.removeChild(vadLogEl.firstChild);
    vadLogEl.scrollTop = vadLogEl.scrollHeight;
  } catch (e) {}
}
function ensureAC() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; } }
  try { if (AC.state === 'suspended') AC.resume(); } catch (e) {}
  return true;
}

var LS_KEY = 'grimmy_gemini_key', LS_MODEL = 'grimmy_gemini_model', LS_WAKE = 'grimmy_wake';
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

keyInput.value = lsGet(LS_KEY, '');
modelInput.value = lsGet(LS_MODEL, 'gemini-3.8-flash');
wakeInput.value = lsGet(LS_WAKE, 'grimmy');
// Google retires old models for new keys; migrate any saved retired name.
(function migrateModel() {
  var retired = ['gemini-2.0-flash', 'gemini-2.5-flash'];
  var cur = lsGet(LS_MODEL, '');
  if (cur && retired.indexOf(cur) !== -1) {
    lsSet(LS_MODEL, 'gemini-3.8-flash');
    modelInput.value = 'gemini-3.8-flash';
  }
})();
function wakeWord() { return (lsGet(LS_WAKE, 'grimmy') || 'grimmy').toLowerCase(); }

gearEl.onclick = function () { panelEl.classList.toggle('hidden'); };
  var relayInput = document.getElementById('set-relay');
  relayInput.value = relayCode();
  relayInput.addEventListener('change', function () { lsSet(LS_RELAY, relayInput.value.trim() || relayCode()); panelNote('Relay code saved on this device.'); });
  if (VIEW === 'phone') panelEl.classList.remove('hidden');
  relayListen();
  document.getElementById('stream-btn').onclick = function () {
    var u = location.pathname + '?view=stream&relay=' + encodeURIComponent(relayCode());
    window.open(u, '_blank');
  };
  var askInput = document.getElementById('ask-input');
  function askTyped() {
    var t = askInput.value.trim(); if (!t) return;
    askInput.value = ''; addTranscript('You', t); askGrimmy(t);
  }
  document.getElementById('ask-btn').onclick = askTyped;
  askInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') askTyped(); });
[keyInput, modelInput, wakeInput].forEach(function (el) {
  el.addEventListener('change', function () {
    lsSet(LS_KEY, keyInput.value.trim());
    lsSet(LS_MODEL, modelInput.value.trim() || 'gemini-3.8-flash');
    lsSet(LS_WAKE, (wakeInput.value.trim() || 'grimmy').toLowerCase());
    panelNote('Saved on this device.');
  });
});
function panelNote(t) { panelStatus.textContent = t; }
function setMic(on) { micEl.classList.toggle('on', !!on); }
function flashCaption(t) {
  capText.textContent = t; cap.classList.add('hidden');
  setTimeout(function () { if (!speaking) cap.classList.add('hidden'); }, 4000);
}

function addTranscript(who, text) {
    try {
      var el = document.getElementById('transcript'); if (!el) return;
      var d = document.createElement('div');
      var s = document.createElement('span'); s.className = who === 'You' ? 'who-you' : 'who-grimmy'; s.textContent = who + ': ';
      d.appendChild(s); d.appendChild(document.createTextNode(text)); el.appendChild(d); el.scrollTop = el.scrollHeight;
    } catch (e) {}
  }
  var LS_RELAY = 'grimmy_relay';
  function relayCode() {
    var q = qs.get('relay'); if (q) return q;
    var v = lsGet(LS_RELAY, ''); if (v) return v;
    return 'grimmy-live-' + CHANNEL;
  }
  var lastRelay = { text: '', at: 0 };
  function relaySend(text) {
    if (VIEW === 'stream') return;
    try { if (window.BroadcastChannel) new BroadcastChannel('grimmy-live').postMessage({ text: text, at: Date.now() }); } catch (e) {}
    try { localStorage.setItem('grimmy-live-msg', JSON.stringify({ text: text, at: Date.now() })); } catch (e) {}
    try { fetch('https://ntfy.sh/' + encodeURIComponent(relayCode()), { method: 'POST', body: text, keepalive: true }).catch(function () {}); } catch (e) {}
  }
  function relayReceive(text) {
    if (VIEW !== 'stream' || !text) return;
    var now = Date.now();
    if (text === lastRelay.text && now - lastRelay.at < 5000) return;
    lastRelay = { text: text, at: now };
    queue.push(text); pump();
  }
  function relayListen() {
    if (VIEW !== 'stream') return;
    try { if (window.BroadcastChannel) new BroadcastChannel('grimmy-live').onmessage = function (ev) { if (ev.data && ev.data.text) relayReceive(ev.data.text); }; } catch (e) {}
    try { window.addEventListener('storage', function (ev) { if (ev.key === 'grimmy-live-msg' && ev.newValue) { try { relayReceive(JSON.parse(ev.newValue).text); } catch (e) {} } }); } catch (e) {}
    try {
      var es = new EventSource('https://ntfy.sh/' + encodeURIComponent(relayCode()) + '/sse');
      es.onmessage = function (ev) { try { var j = JSON.parse(ev.data); if (j && j.message) relayReceive(j.message); } catch (e) {} };
    } catch (e) {}
  }
  var GRIMMY_SYS = "You are Grimmy, a skeleton with glowing purple eyes and a purple hooded cloak, the on-stream co-host of Zack's Twitch channel zackplayspro. Zack plays Fortnite Zero Build on Xbox. You are playful and witty, you lightly roast Zack, hype up good plays, and riff with chat. You are SPEAKING ALOUD on a livestream: keep every reply to 1-2 short sentences, plain spoken text only. No emojis, no markdown, no hashtags, no stage directions, no quotation marks around the reply. Never break character, never mention you are an AI.";

var listenWanted = false;
var AC = null, micStream = null, analyser = null, micNode = null;
var vad = { ambient: 0.01, state: 'idle', rec: null, chunks: [], wantSend: false, lastMime: 'audio/webm', loudFor: 0, quietFor: 0, recStart: 0, cooldownUntil: 0 };
var VAD_TICK = 100;

function rmsLevel() {
  try {
    if (!analyser) return 0;
    var buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    var sum = 0;
    for (var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    return Math.sqrt(sum / buf.length);
  } catch (e) { return 0; }
}

function startListenAudio() {
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
    .then(function (stream) {
      if (!listenWanted) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} return; }
      micStream = stream;
      if (!AC && !ensureAC()) {
        panelNote('Audio not supported in this browser.');
        listenWanted = false; listenBtn.textContent = 'Start listening'; setMic(false);
        return;
      }
      vlog('mic open');
      micNode = AC.createMediaStreamSource(stream);
      analyser = AC.createAnalyser();
      analyser.fftSize = 2048;
      micNode.connect(analyser);
      panelNote('Calibrating mic, stay quiet...');
      var samples = [];
      var cal = setInterval(function () {
        if (!listenWanted) { clearInterval(cal); return; }
        samples.push(rmsLevel());
        if (samples.length >= 12) {
          clearInterval(cal);
          samples.sort(function (a, b) { return a - b; });
          vad.ambient = Math.max(0.008, samples[Math.floor(samples.length * 0.7)]);
          setMic(true);
          vlog('ambient ' + vad.ambient.toFixed(4) + ' - talk to test the bar');
          panelNote('Listening for "' + wakeWord() + '"...');
          vadLoop();
        }
      }, 100);
    })
    .catch(function () {
      panelNote('Mic blocked. Allow the microphone for this page, then start again.');
      listenWanted = false; listenBtn.textContent = 'Start listening'; setMic(false);
    });
}

function vadLoop() {
  if (!listenWanted || !analyser) return;
  var level = rmsLevel();
  var now = Date.now();
  var thresh = vad.ambient * 3.2;
  try { vadFillEl.style.width = Math.min(100, (level / (thresh * 2)) * 100) + '%'; } catch (e) {}
  if (speaking || queue.length || now < vad.cooldownUntil) {
    if (vad.state === 'recording') stopRecording(false);
    vad.state = 'idle';
  } else if (vad.state === 'idle') {
    if (level > thresh) { vad.state = 'maybe'; vad.loudFor = now; }
  } else if (vad.state === 'maybe') {
    if (level > thresh) { if (now - vad.loudFor > 250) startRecording(); }
    else vad.state = 'idle';
  } else if (vad.state === 'recording') {
    if (level > thresh) vad.quietFor = now;
    else if (now - vad.quietFor > 1300) stopRecording(true);
    else if (now - vad.recStart > 12000) stopRecording(true);
  }
  setTimeout(vadLoop, VAD_TICK);
}

function startRecording() {
  if (!window.MediaRecorder) { vad.state = 'idle'; return; }
  vad.chunks = [];
  var mime = '';
  try {
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
    else if (MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
  } catch (e) {}
  try { vad.rec = mime ? new MediaRecorder(micStream, { mimeType: mime }) : new MediaRecorder(micStream); }
  catch (e) { vad.state = 'idle'; return; }
  vad.rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) vad.chunks.push(ev.data); };
  vad.rec.onstop = function () {
    var blob = new Blob(vad.chunks, { type: vad.lastMime || 'audio/webm' });
    var send = vad.wantSend;
    vad.chunks = []; vad.wantSend = false;
    if (send) transcribeBlob(blob, vad.lastMime);
  };
  vad.quietFor = Date.now();
  vad.recStart = Date.now();
  try { vad.rec.start(250); }
  catch (e) { vad.state = 'idle'; vad.rec = null; return; }
  vad.state = 'recording';
  vlog('speech detected, recording');
}

function stopRecording(send) {
  var r = vad.rec;
  vad.rec = null;
  vad.state = 'idle';
  vad.cooldownUntil = Date.now() + 1500;
  vad.wantSend = !!send;
  vad.lastMime = (r && r.mimeType) || 'audio/webm';
  if (!r) return;
  try { if (r.state !== 'inactive') r.stop(); } catch (e) {}
}

function transcribeBlob(blob, type) {
  if (!blob || blob.size < 800) return;
  var key = lsGet(LS_KEY, '').trim();
  if (!key) { panelNote('Add your Gemini API key in settings first.'); return; }
  vlog('transcribing ' + Math.round(blob.size / 1024) + 'kb');
  var reader = new FileReader();
  reader.onload = function () {
    var b64 = String(reader.result || '').split(',')[1];
    if (!b64) return;
    var model = (lsGet(LS_MODEL, 'gemini-3.8-flash').trim() || 'gemini-3.8-flash');
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key);
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [
          { text: 'Transcribe exactly what the person says in this audio. Output only the transcription, no commentary. If there is no intelligible speech, output NOTHING.' },
          { inlineData: { mimeType: type || 'audio/webm', data: b64 } }
        ] }],
        generationConfig: { maxOutputTokens: 120, temperature: 0.2 }
      })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.error) { vlog('transcribe error: ' + (j.error.message || 'unknown')); return; }
      var t = j && j.candidates && j.candidates[0] && j.candidates[0].content &&
        j.candidates[0].content.parts && j.candidates[0].content.parts[0] &&
        j.candidates[0].content.parts[0].text;
      t = String(t || '').trim();
      vlog('heard: "' + t + '"');
      if (t && t.toUpperCase() !== 'NOTHING') heard(t);
    }).catch(function () { vlog('transcribe failed'); });
  };
  reader.readAsDataURL(blob);
}

function heard(raw) {
  var t = String(raw || '').trim();
  if (!t) return;
  var w = wakeWord();
  var low = t.toLowerCase();
  var ix = low.indexOf(w), used = w.length;
  if (ix === -1) { ix = low.indexOf('grim'); used = 4; }
  if (ix === -1) return;
  if (speaking || queue.length) return;
  var said = t.slice(ix + used).replace(/^[\s,.:;!\-]+/, '').trim();
  if (!said) said = '(Zack just said your name to get your attention. Greet him briefly.)';
  addTranscript('You', said); askGrimmy(said);
}

function cleanReply(s) {
  s = String(s || '').replace(/[*_#`>]/g, '').replace(/\s+/g, ' ').trim();
  if (s.length > 300) s = s.slice(0, 297).trim() + '...';
  return s;
}

function askGrimmy(promptText) {
  var key = lsGet(LS_KEY, '').trim();
  if (!key) {
    panelNote('Add your Gemini API key in settings first.');
    flashCaption('Add your API key in the settings gear first.');
    return;
  }
  vlog('asking brain...');
  var model = lsGet(LS_MODEL, 'gemini-3.8-flash').trim() || 'gemini-3.8-flash';
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
    encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key);
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: GRIMMY_SYS }] },
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: { maxOutputTokens: 120, temperature: 0.9 }
    })
  }).then(function (r) {
    return r.json().then(function (j) { return { ok: r.ok, j: j }; });
  }).then(function (res) {
    var txt = res.j && res.j.candidates && res.j.candidates[0] && res.j.candidates[0].content &&
      res.j.candidates[0].content.parts && res.j.candidates[0].content.parts[0] &&
      res.j.candidates[0].content.parts[0].text;
    txt = cleanReply(txt);
    if (txt) { vlog('replying'); addTranscript('Grimmy', txt); relaySend(txt); queue.push(txt); pump(); }
    else panelNote('Brain error: ' + ((res.j && res.j.error && res.j.error.message) || 'empty reply'));
  }).catch(function (e) { vlog('brain unreachable'); panelNote('Brain unreachable. Check connection.'); });
}

function setListen(on) {
  listenWanted = !!on;
  listenBtn.textContent = listenWanted ? 'Stop listening' : 'Start listening';
  if (listenWanted) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      panelNote('Mic capture not supported here. Use Chrome.');
      listenWanted = false; listenBtn.textContent = 'Start listening';
      return;
    }
    vad.state = 'idle'; vad.cooldownUntil = 0; vad.chunks = [];
    panelNote('Starting mic...');
    startListenAudio();
  } else {
    try { if (vad.rec && vad.rec.state !== 'inactive') vad.rec.stop(); } catch (e) {}
    vad.rec = null; vad.state = 'idle'; vad.chunks = [];
    try { if (micStream) micStream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {}
    micStream = null;
    try { if (AC && AC.close) AC.close(); } catch (e) {}
    AC = null; analyser = null; micNode = null;
    setMic(false); panelNote('Stopped.');
  }
}
listenBtn.onclick = function () { ensureAC(); setListen(!listenWanted); };

var askParam = qs.get('ask');
if (askParam !== null) {
  setTimeout(function () { askGrimmy(askParam || 'Say hello to the stream.'); }, 1500);
}
</script>
</body>
